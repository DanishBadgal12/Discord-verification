<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>
Account Verification
</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="box">

<h2>
Account Verification
</h2>

<input
id="name"
placeholder="Full Name">

<input
id="discord"
placeholder="Discord Username">

<input
id="nickname"
placeholder="Nickname">

<textarea
id="msg"
placeholder="Message"
rows="4">
</textarea>

<button
id="submitBtn">

Verify

</button>

<p class="note">
Demo verification form
</p>

</div>

<script
src="script.js">
</script>

</body>

</html>
